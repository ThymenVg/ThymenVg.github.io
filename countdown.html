<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="scripts/countdown.js" defer></script>
    <link rel="stylesheet" href="css/countdown.css" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <meta charset="UTF-8" />
    <meta name="description" content="A countdown to my trip to the land of the free 2027">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>
  </head>
  <body class="countdown-loading">
    <main class="stacked">
      <div id="slot-machine" aria-label="Days until Jan 30, 2027">
        <div class="reel">
          <div class="digit">0</div>
        </div>
        <div class="reel">
          <div class="digit">0</div>
        </div>
        <div class="reel">
          <div class="digit">0</div>
        </div>
      </div>
      <div class="days-label visible">DAYS</div>
      <div class="days-sub visible">Until Thymen's trip to the States :)</div>
    </main>
    <img class="freedom-image" src="images/freedom.png" alt="Freedom" />
    <img class="flag-image" src="images/flag.png" alt="Flag" />
  </body>
</html>
